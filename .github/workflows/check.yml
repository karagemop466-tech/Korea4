name: Verify final integration

on:
  push:
    branches: [arena/72e6d3f7-korea4]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verification dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify official data, source rows, links and JS
        run: |
          python scripts/verify.py
          node --check js/app.js
