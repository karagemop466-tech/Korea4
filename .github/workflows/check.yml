name: Verify planner

on:
  push:
    branches: [arena/9d83abee-korea4]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test parsers, data and local links
        run: |
          python3 -m unittest discover -s tests -v
          node tests/test_core.mjs
          python3 scripts/build_site.py
