name: Fetch official source snapshots

on:
  push:
    branches: [arena/72e6d3f7-korea4]
    paths:
      - scripts/fetch_official.py
      - .github/workflows/fetch-official.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-official-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch compressed official responses
        run: >-
          python scripts/fetch_official.py --refresh-errors
          --force-keys "${{ inputs.force_keys }}"
          --force-prefix "${{ inputs.force_prefix }}"
      - name: Publish snapshot to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/official/raw research/official/manifest.json research/official/wwo_event_categories.json
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "Publish official-source response snapshot [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
