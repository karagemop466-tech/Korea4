name: Initial official schedule snapshot
on:
  push:
    branches: [arena/9d83abee-korea4]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/9d83abee-korea4
      - name: Test source parsers
        run: python3 -m unittest discover -s tests -v
      - name: Fetch official schedules
        run: python3 scripts/refresh.py
      - name: Store initial snapshot on the session branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/events.json
          git diff --cached --quiet || git commit -m 'Refresh official schedule snapshot [skip ci]'
          git pull --rebase origin arena/9d83abee-korea4
          git push origin arena/9d83abee-korea4
