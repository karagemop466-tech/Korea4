name: Probe official sources

on:
  push:
    branches:
      - arena/72e6d3f7-korea4
    paths:
      - scripts/probe_sources.py
      - scripts/compact_probe.py
      - .github/workflows/probe-sources.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-source-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out fixed session branch
        uses: actions/checkout@v4
        with:
          ref: arena/72e6d3f7-korea4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official source responses
        run: python scripts/probe_sources.py
      - name: Compress responses for offline verification
        run: python scripts/compact_probe.py
      - name: Upload raw official responses for offline verification
        uses: actions/upload-artifact@v4
        with:
          name: official-source-probe
          path: probe_out/
          retention-days: 3
          if-no-files-found: error
      - name: Publish compressed probe snapshot to fixed branch
        env:
          BRANCH: arena/72e6d3f7-korea4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "$BRANCH"
          git add research/probe
          if git diff --cached --quiet; then
            echo "No probe snapshot changes to commit"
          else
            git commit -m "Publish official-source probe snapshot [skip ci]"
            git push origin "HEAD:$BRANCH"
          fi
