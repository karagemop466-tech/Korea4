name: Verify static Pages source

on:
  push:
    branches: [main, arena/aea8720a-korea4]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verification dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify official data and internal links
        run: python scripts/verify.py
      - name: Check browser JavaScript syntax
        run: node --check js/app.js
      - name: Run provenance and scheduling regressions
        run: |
          python -m unittest discover -s tests -p test_verification.py
          npm test
